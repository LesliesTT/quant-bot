name: 量化机器人 v1

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点运行
  workflow_dispatch:        # 支持手动触发

jobs:
  run-quant-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复持仓状态缓存
        uses: actions/cache@v4
        with:
          path: positions.json
          key: quant-positions-${{ github.run_id }}
          restore-keys: |
            quant-positions-

      - name: 运行量化机器人
        env:
          BINANCE_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --once

      - name: 保存持仓状态缓存
        if: always()
        uses: actions/cache@v4
        with:
          path: positions.json
          key: quant-positions-${{ github.run_id }}

  daily-summary:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复持仓状态缓存
        uses: actions/cache@v4
        with:
          path: positions.json
          key: quant-positions-${{ github.run_id }}
          restore-keys: |
            quant-positions-

      - name: Post 安装 Python 3.11
        env:
          BINANCE_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --summary
